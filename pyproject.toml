[project]
name = "noregress-kit"
version = "0.1.0"
description = "Regression testing toolkit for AI features"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12,<1.0",
]

[project.scripts]
noregress = "noregress.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noregress"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src/noregress"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

executionEnvironments = [
    { root = "src/noregress/domain", typeCheckingMode = "strict" },
    { root = "src/noregress/analysis", typeCheckingMode = "strict" },
    { root = "src/noregress", typeCheckingMode = "basic" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"